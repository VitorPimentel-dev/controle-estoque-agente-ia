spring.application.name=controleestoque

# Banco H2 salvo em arquivo local na pasta ./data
spring.datasource.url=jdbc:h2:file:./data/estoquedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf sem cache para facilitar ajustes na tela
spring.thymeleaf.cache=false

# Agente (ollama local)
ollama.url=http://localhost:11434
ollama.model=qwen2.5:1.5b

# URL que o navegador do agente abre
app.base-url=http://localhost:8080

# devtools reinicia o app e derruba o agente no meio da execucao
spring.devtools.restart.enabled=false