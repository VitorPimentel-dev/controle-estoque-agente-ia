<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque - Realtec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/produtos">Realtec | Estoque & Pedidos</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/produtos">Produtos</a>
            <a class="nav-link" href="/pedidos">Pedidos</a>
            <a class="nav-link" href="/agente">Agente IA</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Alertas de Sucesso e Erro -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulário de Novo Produto -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">Cadastrar Novo Produto</div>
        <div class="card-body">
            <form th:action="@{/produtos/salvar}" th:object="${novoProduto}" method="post" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Código</label>
                    <input type="text" th:field="*{codigo}" class="form-control" placeholder="Ex: PRD-001" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Descrição</label>
                    <input type="text" th:field="*{descricao}" class="form-control" placeholder="Nome do produto" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preço Unitário (R$)</label>
                    <input type="number" step="0.01" min="0.01" th:field="*{precoUnitario}" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Estoque Inicial</label>
                    <input type="number" min="0" th:field="*{quantidadeEstoque}" class="form-control" value="0" required>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Barra de Busca -->
    <form th:action="@{/produtos}" method="get" class="row g-2 mb-3">
        <div class="col-md-10">
            <input type="text" name="termo" th:value="${termo}" class="form-control" placeholder="Buscar por código ou descrição...">
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary w-100">Buscar</button>
            <a href="/produtos" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <!-- Tabela de Produtos -->
    <div class="card shadow-sm">
        <div class="card-header fw-bold">Produtos em Estoque</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Preço Unitário</th>
                    <th>Saldo Atual</th>
                    <th>Movimentar Estoque</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                </tr>
                <tr th:each="p : ${produtos}">
                    <td class="fw-bold" th:text="${p.codigo}"></td>
                    <td th:text="${p.descricao}"></td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span class="badge fs-6"
                              th:classappend="${p.quantidadeEstoque == 0 ? 'bg-danger' : 'bg-secondary'}"
                              th:text="${p.quantidadeEstoque}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <!-- Formulário de Entrada -->
                            <form th:action="@{/produtos/{codigo}/entrada(codigo=${p.codigo})}" method="post" class="d-flex gap-1">
                                <input type="number" name="quantidade" min="1" value="1" class="form-control form-control-sm" style="width: 70px;" required>
                                <button type="submit" class="btn btn-sm btn-outline-success">+ Entrada</button>
                            </form>
                            <!-- Formulário de Saída -->
                            <form th:action="@{/produtos/{codigo}/saida(codigo=${p.codigo})}" method="post" class="d-flex gap-1">
                                <input type="number" name="quantidade" min="1" value="1" class="form-control form-control-sm" style="width: 70px;" required>
                                <button type="submit" class="btn btn-sm btn-outline-danger">- Saída</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const campoBusca = document.querySelector('input[name="termo"]');
    const linhasTabela = document.querySelectorAll('tbody tr');

    if (campoBusca) {
        campoBusca.setAttribute('autocomplete', 'off');
        campoBusca.addEventListener('input', function () {
            const termo = this.value.toLowerCase().trim();
            linhasTabela.forEach(linha => {
                if (linha.children.length === 1) return;
                const textoLinha = linha.textContent.toLowerCase();
                linha.style.display = textoLinha.includes(termo) ? '' : 'none';
            });
        });
    }
</script>
</body>
</html>
