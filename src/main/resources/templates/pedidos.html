<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - Realtec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/produtos">Realtec | Estoque & Pedidos</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/produtos">Produtos</a>
            <a class="nav-link active" href="/pedidos">Pedidos</a>
            <a class="nav-link" href="/agente">Agente IA</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Alertas de Sucesso e Erro -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Criar Novo Rascunho de Pedido -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">Novo Pedido (Rascunho)</div>
        <div class="card-body">
            <form th:action="@{/pedidos/criar}" method="post" class="row g-3">
                <div class="col-md-9">
                    <input type="text" name="identificador" class="form-control"
                           placeholder="Identificador do pedido (Ex: PED-001)" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">+ Criar Rascunho</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mensagem caso não existam pedidos -->
    <div th:if="${#lists.isEmpty(pedidos)}" class="card shadow-sm">
        <div class="card-body text-center text-muted py-5">
            Nenhum pedido registrado até o momento. Crie um rascunho acima para começar.
        </div>
    </div>

    <!-- Lista de Pedidos -->
    <div th:each="pedido : ${pedidos}" class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between align-items-center bg-white">
            <div>
                <span class="fw-bold fs-5 me-2" th:text="${pedido.identificador}"></span>
                <span class="badge"
                      th:classappend="${pedido.status.name() == 'RASCUNHO' ? 'bg-warning text-dark' :
                                       (pedido.status.name() == 'CONFIRMADO' ? 'bg-success' : 'bg-danger')}"
                      th:text="${pedido.status}"></span>
                <small class="text-muted ms-3" th:if="${pedido.dataCriacao != null}"
                       th:text="${#temporals.format(pedido.dataCriacao, 'dd/MM/yyyy HH:mm')}"></small>
            </div>

            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold fs-5 me-3 text-primary"
                      th:text="${'Total: R$ ' + #numbers.formatDecimal(pedido.valorTotal != null ? pedido.valorTotal : 0, 1, 'POINT', 2, 'COMMA')}"></span>

                <!-- Botão Confirmar (só aparece em RASCUNHO) -->
                <form th:if="${pedido.status.name() == 'RASCUNHO'}"
                      th:action="@{/pedidos/{id}/confirmar(id=${pedido.identificador})}" method="post">
                    <button type="submit" class="btn btn-sm btn-success">Confirmar Pedido</button>
                </form>

                <!-- Botão Cancelar (aparece em RASCUNHO ou CONFIRMADO) -->
                <form th:if="${pedido.status.name() != 'CANCELADO'}"
                      th:action="@{/pedidos/{id}/cancelar(id=${pedido.identificador})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                </form>
            </div>
        </div>

        <div class="card-body">
            <!-- Formulário para Adicionar Item (só aparece em RASCUNHO) -->
            <form th:if="${pedido.status.name() == 'RASCUNHO'}"
                  th:action="@{/pedidos/{id}/itens/adicionar(id=${pedido.identificador})}"
                  method="post" class="row g-2 mb-3">
                <div class="col-md-7">
                    <select name="codigoProduto" class="form-select" required>
                        <option value="" disabled selected>Selecione um produto para adicionar...</option>
                        <option th:each="prod : ${produtos}"
                                th:value="${prod.codigo}"
                                th:text="${prod.codigo + ' - ' + prod.descricao + ' (Saldo: ' + prod.quantidadeEstoque + ' | R$ ' + #numbers.formatDecimal(prod.precoUnitario, 1, 'POINT', 2, 'COMMA') + ')'}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" name="quantidade" min="1" value="1" class="form-control" placeholder="Qtd" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">+ Adicionar</button>
                </div>
            </form>

            <!-- Tabela de Itens do Pedido -->
            <table class="table table-sm table-bordered align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Produto</th>
                    <th class="text-center" style="width: 110px;">Qtd</th>
                    <th class="text-end" style="width: 150px;">Preço Unit.</th>
                    <th class="text-end" style="width: 150px;">Subtotal</th>
                    <th th:if="${pedido.status.name() == 'RASCUNHO'}" class="text-center" style="width: 100px;">Ação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pedido.itens)}">
                    <td colspan="5" class="text-center text-muted py-3">Nenhum item adicionado a este pedido.</td>
                </tr>
                <tr th:each="item : ${pedido.itens}">
                    <td th:text="${item.produto.codigo + ' - ' + item.produto.descricao}"></td>
                    <td class="text-center" th:text="${item.quantidade}"></td>
                    <td class="text-end"
                        th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitarioRegistrado, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="text-end fw-bold"
                        th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:if="${pedido.status.name() == 'RASCUNHO'}" class="text-center">
                        <form th:action="@{/pedidos/{id}/itens/{itemId}/remover(id=${pedido.identificador}, itemId=${item.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
